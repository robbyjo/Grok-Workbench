name: One-time v0.8.5 publication dispatch
on:
  push:
    branches: [codex/publish-v0-8-5]
    paths: [.github/workflows/dispatch-v085.yml]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: github.repository == 'robbyjo/Grok-Workbench'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Dispatch accepted main publisher, then deploy its website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const repository = 'robbyjo/Grok-Workbench';
          const source = '626a93a30818d1c66d8a65ee9a95375d44a32ca7';
          const runIds = {windows:41274679777,linux:41274679751,macos:41274680825};
          const api = async (route, body) => {
            const response = await fetch(`https://api.github.com/repos/${repository}/${route}`, {
              method: body ? 'POST' : 'GET',
              headers: {Authorization:`Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json', 'X-GitHub-Api-Version':'2026-03-10'},
              ...(body ? {body:JSON.stringify(body)} : {}),
              signal:AbortSignal.timeout(30000),
            });
            if(!response.ok) throw new Error(`GitHub request ${route}: ${response.status}`);
            return response.status===204 ? null : response.json();
          };
          const pause = () => new Promise(resolve=>setTimeout(resolve,15000));
          async function waitFor(workflow, since) {
            for(let attempt=0;attempt<100;attempt++) {
              const {workflow_runs:runs} = await api(`actions/workflows/${workflow}/runs?event=workflow_dispatch&per_page=20`);
              const matches = runs.filter(run=>run.head_sha===source && run.head_branch==='main' && Date.parse(run.created_at)>=since);
              if(matches.length>1) throw new Error('Ambiguous workflow dispatch identity.');
              if(matches.length===1) {
                const run = matches[0];
                if(run.status==='completed') {
                  assert.equal(run.conclusion,'success',run.html_url);
                  console.log(`Accepted workflow: ${run.html_url}`);
                  return run;
                }
              }
              await pause();
            }
            throw new Error('Dispatched workflow did not complete within the bounded wait.');
          }
          async function main() {
            assert.equal((await api('git/ref/heads/main')).object.sha,source);
            const workflows={windows:'.github/workflows/windows.yml',linux:'.github/workflows/experimental-linux.yml',macos:'.github/workflows/experimental-macos.yml'};
            for(const [platform,id] of Object.entries(runIds)) {
              let run;
              for(let attempt=0;attempt<60;attempt++) {
                run = await api(`actions/runs/${id}`);
                if(run.status==='completed') break;
                await pause();
              }
              assert.equal(run.head_sha,source);assert.equal(run.path,workflows[platform]);
              assert.equal(run.repository.full_name,repository);assert.equal(run.status,'completed');assert.equal(run.conclusion,'success');
              assert.ok(['push','workflow_dispatch'].includes(run.event));
              assert.equal(run.head_branch,platform==='macos'?'codex/linux-macos-builds':'main');
            }
            assert.equal((await api('git/ref/heads/main')).object.sha,source);
            const since = Date.now()-1000;
            await api('actions/workflows/release.yml/dispatches',{ref:'main',inputs:{run_id:String(runIds.windows),linux_run_id:String(runIds.linux),macos_run_id:String(runIds.macos),signed:'false'}});
            await waitFor('release.yml',since);
            const release=await api('releases/tags/v0.8.5');
            assert.equal(release.draft,false);assert.equal(release.prerelease,false);assert.equal(release.target_commitish,source);assert.equal(release.assets.length,18);
            assert.equal((await api('releases/latest')).id,release.id);
            const websiteSince=Date.now()-1000;
            await api('actions/workflows/website.yml/dispatches',{ref:'main'});
            await waitFor('website.yml',websiteSince);
            console.log('V085_RELEASE_AND_WEBSITE_WORKFLOWS_COMPLETED');
          }
          main().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
